# -----------------------------------------------------------------------------
# Continuous integration: every pull request, and the quality gate of the
# Release workflow (workflow_call) on every push to main. No `push` trigger of
# its own on main: release.yml runs it there, so a release is never cut from a
# commit whose checks failed.
#
#   1. Prettier, ESLint and the tests, on Node 22 (the oldest version
#      `engines` accepts) and Node 24 (the one the image ships with);
#   2. the store admission checks, without the image check (the image of a
#      version only exists once it is released);
#   3. the Docker image, built for amd64 and never pushed, then started like
#      Gladys runs it: a broken Dockerfile or a module that does not load
#      shows up here rather than in a release.
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Checks only read the code: no write scope for the token.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  store:
    runs-on: ubuntu-latest
    name: Store admission checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Validate the manifest, the cover and the docs
        run: npx --yes github:GladysAssistant/integration-store . --skip-image-check

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build as build.yml, without pushing, and for amd64 only: emulating
      # arm64 is slow, and only the release build needs it.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gladys-jewelbox:ci

      # The image as Gladys runs it (read-only, unprivileged, 256 MB, no
      # network): every module loads, the devices build, a widget is valid,
      # and a request without network fails cleanly.
      - name: Smoke test of the image
        run: |
          set -euo pipefail
          docker run --rm --read-only --memory 256m --network none --user node \
            --tmpfs /data:uid=1000,gid=1000 --entrypoint node gladys-jewelbox:ci \
            --input-type=module -e "
              const { createApp } = await import('/app/src/app.js');
              const { buildCollectionDevice, buildPlayerDevice } = await import('/app/src/devices.js');
              const { buildCollectionWidget } = await import('/app/src/widgets.js');
              const { createClient } = await import('/app/src/client.js');
              const { validateWidgetContent } = await import('@gladysassistant/integration-sdk');
              const gladys = { externalIds: (t, i) => ({ device: 'ext:x:' + t + ':' + i, feature: (k) => 'ext:x:' + t + ':' + i + ':' + k }) };
              const collection = buildCollectionDevice(gladys, { serverId: 'abc' }, 'fr');
              const player = buildPlayerDevice(gladys, 'f490e970-5c9d', 'JewelBox Chrome', 'fr');
              const widget = buildCollectionWidget({ stats: { total_owned: 3, total_wanted: 1, total_lent: 0, total_artists: 2, by_decade: [{ decade: 1990, count: 3 }] }, collection: 'CD', language: 'fr' });
              let kind = null;
              try { await createClient().serverInfo('http://192.0.2.1:3001'); } catch (error) { kind = error.kind; }
              if (typeof createApp !== 'function' || collection.features.length !== 7 || player.features.length !== 10 || validateWidgetContent(widget).length > 0 || kind !== 'network') {
                process.exit(1);
              }
              console.log('modules load, devices build, a widget is valid, no network is a clean error');
            "
